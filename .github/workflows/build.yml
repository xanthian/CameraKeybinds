# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build all supported Minecraft versions
        run: |
          ./gradlew clean
          ./gradlew build -Pminecraft_version=26.1 -Pfabric_version=0.145.1+26.1
          ./gradlew build -Pminecraft_version=26.1.1 -Pfabric_version=0.145.4+26.1.1
          ./gradlew build -Pminecraft_version=26.1.2 -Pfabric_version=0.155.3+26.1.2
          ./gradlew build -Pminecraft_version=26.2 -Pfabric_version=0.161.0+26.2
          ./gradlew build -Pminecraft_version=26.3 -Pfabric_version=0.167.0+26.3
          cp .github/download-guide.txt build/libs/READ-ME-FIRST.txt
      - name: download bundle
        uses: actions/upload-artifact@v7
        with:
          name: Camera-Keybinds-all-supported-versions
          if-no-files-found: error
          path: |
            build/libs/
            !build/libs/*-sources.jar
