# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        include:
          - minecraft: '1.21.9'
            yarn: '1.21.9+build.1'
            fabric: '0.134.1+1.21.9'
          - minecraft: '1.21.10'
            yarn: '1.21.10+build.3'
            fabric: '0.138.4+1.21.10'
          - minecraft: '1.21.11'
            yarn: '1.21.11+build.6'
            fabric: '0.141.6+1.21.11'
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }} -Pyarn_mappings=${{ matrix.yarn }} -Pfabric_version=${{ matrix.fabric }}
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts-${{ matrix.minecraft }}
          path: build/libs/
